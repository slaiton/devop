name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # IMAGE_REPO = valor que se exporta en el servidor y que usa docker-compose.prod.yml
  IMAGE_REPO: ghcr.io/${{ github.repository_owner }}

jobs:
  # ─── Construir y publicar las tres imágenes en paralelo ──────────────────────
  build:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - service: api
            context: .
            dockerfile: apps/api/Dockerfile
          - service: worker
            context: .
            dockerfile: apps/worker/Dockerfile
          - service: web
            context: apps/web
            dockerfile: apps/web/Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.IMAGE_REPO }}/devsentinel-${{ matrix.service }}:latest
            ${{ env.IMAGE_REPO }}/devsentinel-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # ─── Desplegar en el servidor de producción ──────────────────────────────────
  deploy:
    name: Deploy to Production
    needs: build
    runs-on: ubuntu-latest
    environment: production   # requiere aprobación manual si está configurado en GitHub

    steps:
      - name: Checkout (para Caddyfile, compose y scripts)
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: IMAGE_REPO
          script: |
            set -e
            cd /opt/devsentinel

            # Asegurarse de tener el código más reciente (Caddyfile, configs, scripts)
            git pull origin main

            export IMAGE_REPO=${{ env.IMAGE_REPO }}
            export VERSION=${{ github.sha }}

            # Login en GHCR desde el servidor para poder hacer pull
            echo "${{ secrets.GITHUB_TOKEN }}" | \
              docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Pull de las imágenes recién construidas
            docker compose -f docker-compose.prod.yml pull web api worker

            # Restart en orden: api primero (migraciones), luego worker y web
            docker compose -f docker-compose.prod.yml up -d --no-build api
            sleep 20
            docker compose -f docker-compose.prod.yml up -d --no-build worker web

            # Limpiar imágenes antiguas
            docker image prune -f

# ─── Secrets necesarios en GitHub (Settings → Secrets → Actions) ─────────────
# DEPLOY_HOST      — IP o dominio del servidor de producción
# DEPLOY_USER      — usuario SSH (ej: ubuntu, deploy)
# DEPLOY_SSH_KEY   — clave SSH privada (RSA/Ed25519) sin passphrase
