# postgresql.conf — configuración de producción para DevSentinel AI
# Ajustada para un VPS con 2–4 GB de RAM. Escalar shared_buffers al 25% de la RAM total.

# ─── Conexiones ────────────────────────────────────────────────────────────────
max_connections = 50

# ─── Memoria ───────────────────────────────────────────────────────────────────
shared_buffers            = 256MB   # ~25% de RAM disponible
effective_cache_size      = 768MB   # ~75% de RAM disponible
work_mem                  = 8MB     # por operación de sort/hash (max_connections * work_mem = RAM pico)
maintenance_work_mem      = 64MB    # para VACUUM, CREATE INDEX, etc.
wal_buffers               = 16MB

# ─── WAL y checkpoints ─────────────────────────────────────────────────────────
checkpoint_completion_target = 0.9
checkpoint_timeout           = 10min
max_wal_size                 = 1GB
min_wal_size                 = 80MB

# ─── Escritura y durabilidad ───────────────────────────────────────────────────
synchronous_commit = on    # Cambiar a 'off' solo si se acepta pérdida de ≤1 trans. ante crash
wal_writer_delay   = 200ms

# ─── Query planner ─────────────────────────────────────────────────────────────
random_page_cost     = 1.1   # SSD: reducir a 1.0–1.1
effective_io_concurrency = 200

# ─── Logging ───────────────────────────────────────────────────────────────────
log_timezone                = 'UTC'
log_min_duration_statement  = 2000  # registra queries que tardan > 2 s
log_checkpoints             = on
log_connections             = off
log_disconnections          = off
log_lock_waits              = on
log_temp_files              = 0     # registra todos los archivos temporales

# ─── Estadísticas ──────────────────────────────────────────────────────────────
track_activities   = on
track_counts       = on
track_io_timing    = on

# ─── Autovacuum ────────────────────────────────────────────────────────────────
autovacuum                  = on
autovacuum_max_workers      = 2
autovacuum_vacuum_cost_delay = 20ms
autovacuum_vacuum_scale_factor = 0.05  # vaciar tras 5% de filas muertas

# ─── Locale y formato ──────────────────────────────────────────────────────────
datestyle = 'iso, mdy'
timezone  = 'UTC'
lc_messages = 'en_US.UTF-8'
